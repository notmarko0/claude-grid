# Claude Grid — tmux postavke.
# Instalacija ovo stavi u ~/.config/claudegrid/tmux.conf i u ~/.tmux.conf doda
#   source-file ~/.config/claudegrid/tmux.conf
# pa tvoje vlastite tmux postavke ostaju netaknute. Mijenjaj slobodno.

# Sakrij statusnu traku po defaultu; prefix + b = uključi/isključi
set -g status off
bind b set -g status

# Miš: klik bira panel, scroll radi, povlačenje mijenja veličinu
set -g mouse on

# Spriječi poruku "not in mode" kad se scrollom vratiš na dno
bind -T root WheelDownPane if -F -t= "#{mouse_any_flag}" "send -M" "if -F -t= '#{pane_in_mode}' 'send -X -N 1 scroll-down' 'send -M'"

# === Izgled: obrubi uvijek iste boje (linija se nikad ne "lomi"), aktivni panel
#     prepoznaješ po jarkoj traci "▶ SESSION N ◀" na vrhu; neaktivni = prigušen broj.
# Boje mijenjaj ovdje (hex). NAPOMENA: unutar #{?...} ne stavljaj zarez u #[...] —
#   piši #[fg=..]#[bg=..]#[bold] odvojeno (zarez je razdjelnik grana).
setw -g pane-base-index 1
setw -g pane-border-lines heavy
setw -g pane-border-status top
setw -g pane-border-format "#{?pane_active,#[fg=#11111b]#[bg=#ff4d4d]#[bold]  ▶ SESSION #{pane_index} ◀  ,#[fg=#8a5a44] #{pane_index} }"
setw -g pane-active-border-style "fg=#d97757"
setw -g pane-border-style "fg=#d97757"

# === Oznaka aktivnog panela se osvježava ODMAH pri prebacivanju ===
# (traka je na pane-border-statusu, pa treba PUNI refresh-client, ne -S)
set -sg escape-time 0
set -g status-interval 1
set-hook -g after-select-pane 'refresh-client'

# === Claude Grid prečaci (prefix = Ctrl-b) ===
# prefix + j : spoji žive Claude sesije iz drugih prozora u ovaj (fzf + pregled uživo)
bind j display-popup -E -w 80% -h 70% "$HOME/.local/bin/claude-grid-merge.sh"
# prefix + n : nova Claude sesija u ovom prozoru (u poolu: na prvom slobodnom stolu)
bind n run-shell "$HOME/.local/bin/claude-grid-add.sh '#{window_id}'"
# prefix + o : nova Claude sesija na ODREĐENOM stolu (fzf birač) — povratak na granu
bind o display-popup -E -w 80% -h 60% "$HOME/.local/bin/claude-grid-pick.sh '#{window_id}'"
# prefix + x : ugasi panel (uz potvrdu) pa presloži prozor natrag u grid
bind x confirm-before -p "ugasi panel #P? (y/n)" "run-shell \"$HOME/.local/bin/claude-grid-kill.sh '#{pane_id}' '#{window_id}'\""

# === Auto-čišćenje: zatvoriš prozor terminala -> tmux sesija se sama ugasi ===
# (uključuje se tek kad se klijent spoji, da gradnja grida u pozadini preživi)
# Claude razgovori NISU u tmuxu — uvijek ih vratiš s `claude --resume` u istoj mapi.
set-hook -g client-attached 'set-option destroy-unattached on'
